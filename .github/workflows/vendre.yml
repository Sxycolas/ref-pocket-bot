name: Vente des doublons inutiles
on:
  workflow_dispatch:
    inputs:
      generation:
        description: "Générations concernées"
        type: choice
        options:
          - toutes
          - "1"
          - "2"
        default: toutes
      remise:
        description: "Vendre : remise de départ en % par rapport au prix de référence (négative = majoration, ex. -30)"
        default: "20"
      remise_gen1:
        description: "Vendre : remise propre à la Gén. 1 (vide = la remise ci-dessus)"
        default: ""
      remise_gen2:
        description: "Vendre : remise propre à la Gén. 2 (vide = la remise ci-dessus, ex. -50)"
        default: ""
      baisse:
        description: "Vendre : baisse en % du prix de référence, à chaque palier sans acheteur"
        default: "10"
      palier:
        description: "Vendre : heures sans acheteur avant chaque baisse"
        default: "24"
      defausser:
        description: "Vendre : défausser les cartes que personne n'achète, même à la valeur de défausse"
        type: boolean
        default: true
      dry:
        description: "Test à blanc : ne rien modifier"
        type: boolean
        default: false

jobs:
  vendre:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: |
          args=()
          if [ "$DRY" = "true" ]; then args+=(--dry); fi
          if [ "$GENERATION" = "1" ] || [ "$GENERATION" = "2" ]; then args+=("--gen=$GENERATION"); fi
          args+=("--remise=$REMISE" "--baisse=$BAISSE" "--palier=$PALIER")
          if [ -n "$REMISE_GEN1" ]; then args+=("--remise-gen1=$REMISE_GEN1"); fi
          if [ -n "$REMISE_GEN2" ]; then args+=("--remise-gen2=$REMISE_GEN2"); fi
          if [ "$DEFAUSSER" = "false" ]; then args+=(--sans-defausse); fi
          npm run vendre -- "${args[@]}"
        env:
          REF_EMAIL: ${{ secrets.REF_EMAIL }}
          REF_PASS: ${{ secrets.REF_PASS }}
          GENERATION: ${{ inputs.generation }}
          REMISE: ${{ inputs.remise || '20' }}
          REMISE_GEN1: ${{ inputs.remise_gen1 }}
          REMISE_GEN2: ${{ inputs.remise_gen2 }}
          BAISSE: ${{ inputs.baisse || '10' }}
          PALIER: ${{ inputs.palier || '24' }}
          DEFAUSSER: ${{ inputs.defausser }}
          DRY: ${{ inputs.dry }}
      - run: cat ventes.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ventes
          path: ventes.md
