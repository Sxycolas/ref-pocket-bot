name: Cartes manquantes
on:
  workflow_dispatch:

jobs:
  rapport:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run manquantes
        env:
          REF_EMAIL: ${{ secrets.REF_EMAIL }}
          REF_PASS: ${{ secrets.REF_PASS }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASS: ${{ secrets.BOT_PASS }}
      - run: cat cartes-manquantes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: cartes-manquantes
          path: cartes-manquantes.md
