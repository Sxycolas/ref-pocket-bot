name: Amélioration des cartes
on:
  workflow_dispatch:
    inputs:
      legendaires:
        description: "Améliorer les légendaires"
        type: boolean
        default: true
      epiques:
        description: "Améliorer les épiques"
        type: boolean
        default: true
      rares:
        description: "Améliorer les rares"
        type: boolean
        default: true
      communes:
        description: "Améliorer les communes"
        type: boolean
        default: true
      generation:
        description: "Générations à améliorer"
        type: choice
        options:
          - toutes
          - "1"
          - "2"
        default: toutes

jobs:
  ameliore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: |
          raretes=""
          for r in L E R C; do
            if [ "${!r}" = "true" ]; then raretes+="$r"; fi
          done
          gen=()
          if [ "$GENERATION" = "1" ] || [ "$GENERATION" = "2" ]; then gen=("--gen=$GENERATION"); fi
          npm run ameliore -- --raretes="$raretes" "${gen[@]}"
        env:
          GENERATION: ${{ inputs.generation }}
          REF_EMAIL: ${{ secrets.REF_EMAIL }}
          REF_PASS: ${{ secrets.REF_PASS }}
          L: ${{ inputs.legendaires }}
          E: ${{ inputs.epiques }}
          R: ${{ inputs.rares }}
          C: ${{ inputs.communes }}
      - run: cat ameliorations.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ameliorations
          path: ameliorations.md
