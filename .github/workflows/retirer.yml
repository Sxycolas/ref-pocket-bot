name: Retrait des annonces
on:
  workflow_dispatch:
    inputs:
      generation:
        description: "Générations concernées"
        type: choice
        options:
          - toutes
          - "1"
          - "2"
        default: toutes
      cartes:
        description: "Numéros de carte du site séparés par des virgules (vide = toutes les annonces). Choisis une génération : les numéros repartent à 1 en Gén. 2"
        default: ""
      dry:
        description: "Test à blanc : ne rien retirer"
        type: boolean
        default: false

jobs:
  retirer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          args=()
          if [ "$DRY" = "true" ]; then args+=(--dry); fi
          if [ "$GENERATION" = "1" ] || [ "$GENERATION" = "2" ]; then args+=("--gen=$GENERATION"); fi
          if [ -n "$CARTES" ]; then args+=("--retirer=$CARTES"); else args+=(--retirer); fi
          npm run vendre -- "${args[@]}"
        env:
          REF_EMAIL: ${{ secrets.REF_EMAIL }}
          REF_PASS: ${{ secrets.REF_PASS }}
          GENERATION: ${{ inputs.generation }}
          CARTES: ${{ inputs.cartes }}
          DRY: ${{ inputs.dry }}
      - run: cat ventes.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retraits
          path: ventes.md
