name: Booster horaire
on:
  workflow_dispatch:

jobs:
  open:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    env:
      HAS_BOT: ${{ secrets.BOT_EMAIL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node bot.mjs
        env:
          REF_EMAIL: ${{ secrets.REF_EMAIL }}
          REF_PASS: ${{ secrets.REF_PASS }}
      # Facultatif : ouvre aussi les boosters du compte bot (duels.yml), si ses secrets existent.
      - name: Boosters du bot
        if: ${{ env.HAS_BOT == 'true' }}
        continue-on-error: true
        run: node bot.mjs
        env:
          REF_EMAIL: ${{ secrets.BOT_EMAIL }}
          REF_PASS: ${{ secrets.BOT_PASS }}
