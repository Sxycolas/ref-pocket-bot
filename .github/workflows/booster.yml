name: Booster horaire
on:
  workflow_dispatch:
    inputs:
      generation:
        description: "Génération des boosters à ouvrir (toutes = la Gén. 2 d'abord)"
        type: choice
        options:
          - toutes
          - "1"
          - "2"
        default: toutes

jobs:
  open:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    env:
      HAS_BOT: ${{ secrets.BOT_EMAIL != '' }}
      # Vide (toutes les générations) ou --gen=1 / --gen=2
      GEN_ARG: ${{ (inputs.generation == '1' || inputs.generation == '2') && format('--gen={0}', inputs.generation) || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node boosters.mjs $GEN_ARG
        env:
          REF_EMAIL: ${{ secrets.REF_EMAIL }}
          REF_PASS: ${{ secrets.REF_PASS }}
      # Facultatif : ouvre aussi les boosters du compte bot (duels.yml), si ses secrets existent.
      - name: Boosters du bot
        if: ${{ env.HAS_BOT == 'true' }}
        continue-on-error: true
        run: node boosters.mjs $GEN_ARG
        env:
          REF_EMAIL: ${{ secrets.BOT_EMAIL }}
          REF_PASS: ${{ secrets.BOT_PASS }}
